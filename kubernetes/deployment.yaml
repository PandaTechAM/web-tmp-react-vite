apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-vite-template
  namespace: dev
  labels:
    app: react-vite-template
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-vite-template
  template:
    metadata:
      labels:
        app: react-vite-template
    spec:
      containers:
        - name: react-vite-template
          image: $(IMAGE_REFERENCE)
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
      imagePullSecrets:
        - name: nexus-registry
---
apiVersion: v1
kind: Service
metadata:
  name: react-vite-template
  namespace: dev
spec:
  selector:
    app: react-vite-template
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
